name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --release

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Bench smoke test
        run: ./target/release/flounder bench 8

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Pull, build, and restart the bot on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -euo pipefail
            FLOUNDER_DIR="${FLOUNDER_DIR:-$HOME/flounder}"
            if [[ ! -d "$FLOUNDER_DIR/.git" ]]; then
              git clone https://github.com/zacharygarwood/flounder.git "$FLOUNDER_DIR"
            fi
            cd "$FLOUNDER_DIR"
            git fetch --prune origin
            git reset --hard origin/main
            bash deploy/deploy.sh
